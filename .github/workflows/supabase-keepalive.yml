name: Supabase keep-alive

# Hace una consulta real a la base de datos cada 3 días para que
# Supabase no pause el proyecto por inactividad (plan gratuito).
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # para volver a "activar" este workflow y que GitHub no lo deshabilite

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret" >&2
            exit 1
          fi
          # Con RLS la respuesta para anon es una lista vacía, pero un 200
          # igual cuenta como actividad real en la base de datos.
          status=$(curl -sS -m 30 --retry 3 --retry-delay 10 --retry-all-errors -o response.json -w '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Supabase keep-alive query failed" >&2
            head -c 500 response.json >&2 || true
            exit 1
          fi
          echo "Supabase respondió correctamente."

      - name: Keep this workflow enabled
        # GitHub deshabilita los workflows programados en repos públicos tras
        # 60 días sin actividad. Llamar a la API "enable" en cada ejecución
        # reinicia ese contador sin crear commits.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
          echo "Workflow re-activado."
